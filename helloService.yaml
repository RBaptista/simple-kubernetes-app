apiVersion: v1
kind: Service
metadata:
  name: hello-service
spec:
  type: NodePort
  selector:
    app: hello # must match the Pod labels inside simpleDep.yaml
  ports:
    - port: 80 # ClusterIP port
      targetPort: 5000 # port the app listens on   inside the container
      nodePort: 30080 # port on the node

